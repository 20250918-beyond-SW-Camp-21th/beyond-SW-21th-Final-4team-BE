plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'java'
}

bootJar { enabled = true }
jar { enabled = false }

dependencies {
    implementation project(':common')
    implementation project(':infra-common')
    implementation project(':user')
    implementation project(':chatting')
    implementation project(':recruitment')
    implementation project(':matchs')
    implementation project(':review')
    implementation project(':contract')
    implementation project(':settlement')
    implementation project(':subscription')
    implementation project(':email')

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa' // 추가
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui'

}

// IntelliJ IDEA 의존성 동기화를 위한 더미 태스크
tasks.register("prepareKotlinBuildScriptModel") {}
