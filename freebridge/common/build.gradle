plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
}

description = 'common'

dependencies {
    api 'org.springframework:spring-web'
    api 'com.fasterxml.jackson.core:jackson-annotations'
    compileOnly 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'
}

jar { enabled = true }